name: Playwright E2E

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run backend
        run: npm run backend &
      - name: Run Playwright tests
        run: npx playwright test --timeout=120000
        env:
          BASE_URL: http://localhost:8081
          API_URL: http://localhost:8000

<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 800px; margin: 0 auto; }
        .result { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Backend Connection Diagnostic</h1>
    <button onclick="runTests()">Run Tests</button>
    <div id="results"></div>

    <script>
        async function runTests() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Running tests...</p>';
            
            let html = '';
            
            // Test 1: Check current location
            html += `<div class="result success">
                <h3>📍 Current Location</h3>
                <p><strong>URL:</strong> ${window.location.href}</p>
                <p><strong>Protocol:</strong> ${window.location.protocol}</p>
                <p><strong>Hostname:</strong> ${window.location.hostname}</p>
                <p><strong>Port:</strong> ${window.location.port}</p>
            </div>`;
            
            // Test 2: Calculate API URL (same logic as app)
            const protocol = document.location.protocol || 'http:';
            const host = document.location.hostname || '127.0.0.1';
            const apiUrl = `${protocol}//${host}:8000`;
            
            html += `<div class="result success">
                <h3>🔗 Calculated API URL</h3>
                <p><strong>API Base URL:</strong> ${apiUrl}</p>
                <p>This is what the app should be using</p>
            </div>`;
            
            results.innerHTML = html;
            
            // Test 3: Try to connect to backend
            try {
                const response = await fetch(`${apiUrl}/health`);
                const data = await response.json();
                
                html += `<div class="result success">
                    <h3>✅ Backend Health Check</h3>
                    <p><strong>Status:</strong> ${response.status} ${response.statusText}</p>
                    <p><strong>Response:</strong></p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                </div>`;
                
                // Test 4: Try projects endpoint
                const projectsResponse = await fetch(`${apiUrl}/storage/projects`);
                const projectsData = await projectsResponse.json();
                
                html += `<div class="result success">
                    <h3>✅ Projects Endpoint</h3>
                    <p><strong>Status:</strong> ${projectsResponse.status}</p>
                    <p><strong>Projects Count:</strong> ${projectsData.value?.length || 0}</p>
                </div>`;
                
                // Test 5: Try batch endpoint
                const batchResponse = await fetch(`${apiUrl}/storage/batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keys: ['users', 'projects', 'volunteers'] })
                });
                const batchData = await batchResponse.json();
                
                html += `<div class="result success">
                    <h3>✅ Batch Endpoint</h3>
                    <p><strong>Status:</strong> ${batchResponse.status}</p>
                    <p><strong>Users:</strong> ${batchData.items?.users?.length || 0}</p>
                    <p><strong>Projects:</strong> ${batchData.items?.projects?.length || 0}</p>
                    <p><strong>Volunteers:</strong> ${batchData.items?.volunteers?.length || 0}</p>
                </div>`;
                
                html += `<div class="result success">
                    <h2>🎉 ALL TESTS PASSED!</h2>
                    <p>The backend is working correctly.</p>
                    <p><strong>Next steps:</strong></p>
                    <ol>
                        <li>Go back to your app at <a href="http://localhost:8081">http://localhost:8081</a></li>
                        <li>Open browser console (F12)</li>
                        <li>Run: <code>localStorage.clear(); sessionStorage.clear(); location.reload();</code></li>
                    </ol>
                </div>`;
                
            } catch (error) {
                html += `<div class="result error">
                    <h3>❌ Connection Failed</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p><strong>Tried URL:</strong> ${apiUrl}</p>
                    <h4>Possible causes:</h4>
                    <ul>
                        <li>Backend not running on port 8000</li>
                        <li>CORS blocking the request</li>
                        <li>Firewall blocking localhost connections</li>
                    </ul>
                    <h4>To fix:</h4>
                    <ol>
                        <li>Make sure backend is running: <code>npm run backend</code></li>
                        <li>Check backend terminal for errors</li>
                        <li>Try: <code>curl http://127.0.0.1:8000/health</code></li>
                    </ol>
                </div>`;
            }
            
            results.innerHTML = html;
        }
        
        // Auto-run on load
        window.addEventListener('load', runTests);
    </script>
</body>
</html>
